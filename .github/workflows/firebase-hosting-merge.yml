# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js # Optional but good practice to specify Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Or whatever Node.js version your project uses (e.g., '18', '20', '22')

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # Or '**/node_modules' if you prefer to cache project-specific node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHONE_HALACHOT }}
          channelId: live
          projectId: shone-halachot
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks