name: Release & Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      functions-changed: ${{ steps.check.outputs.functions }}
      frontend-changed: ${{ steps.check.outputs.frontend }}
      any-changed: ${{ steps.check.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changes
        id: check
        run: |
          CONFIG_FILES="angular.json|package.json|package-lock.json|tsconfig.json"
          CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "")
          
          FUNCTIONS_CHANGED=false
          FRONTEND_CHANGED=false
          
          if echo "$CHANGES" | grep -q "^functions/"; then
            FUNCTIONS_CHANGED=true
          fi
          
          if echo "$CHANGES" | grep -q -E "^src/|($CONFIG_FILES)"; then
            FRONTEND_CHANGED=true
          fi
          
          echo "functions=$FUNCTIONS_CHANGED" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
          echo "any=$([[ $FUNCTIONS_CHANGED == true || $FRONTEND_CHANGED == true ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  release:
    name: Release
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install function dependencies
        if: needs.detect-changes.outputs.functions-changed == 'true'
        run: cd functions && npm ci

      - name: Build functions
        if: needs.detect-changes.outputs.functions-changed == 'true'
        run: cd functions && npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
        run: npx semantic-release

  deploy:
    name: Deploy to Firebase
    needs: [detect-changes, release]
    if: needs.detect-changes.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci && npm run build:prod
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHONE_HALACHOT }}
          channelId: 'live'
          projectId: 'fir-prompting'
