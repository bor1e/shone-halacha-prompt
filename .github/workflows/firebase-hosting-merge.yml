name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
        run: npx semantic-release

      - name: Prebuild version with semantic version
        run: |
          # Get the latest version from git tags (set by semantic-release)
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "Using semantic version: $VERSION"
          SEMANTIC_RELEASE_VERSION=$VERSION npm run prebuild-version

      - name: Build project
        run: npm run build:prod

  deploy:
    name: Deploy to Firebase
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Prebuild version with semantic version
        run: |
          # Get the latest version from git tags (set by semantic-release)
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "Using semantic version: $VERSION"
          SEMANTIC_RELEASE_VERSION=$VERSION npm run prebuild-version

      - name: Build project
        run: npm run build:prod

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHONE_HALACHOT }}
          channelId: live
          projectId: fir-prompting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks